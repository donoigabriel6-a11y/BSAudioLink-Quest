name: NDK build

on:
  workflow_dispatch:
  push:
    branches:
      - update/1.40.8:
env:
  module_id: bs-audiolink
  qmodName: AudioLink

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

    steps:
      - uses: FranzDiebold/github-env-vars-action@v2
      - uses: actions/checkout@v2
        name: Checkout
        with:
          submodules: true
          lfs: true

      - uses: seanmiddleditch/gha-setup-ninja@v3

      - name: Create ndkpath.txt
        run: |
          echo "$ANDROID_NDK_LATEST_HOME" > ${GITHUB_WORKSPACE}/ndkpath.txt
          cat ${GITHUB_WORKSPACE}/ndkpath.txt

      - name: Get QPM
        if: steps.cache-qpm-deps.outputs.cache-hit != 'true'
        uses: dawidd6/action-download-artifact@v2
        with:
          github_token: ${{secrets.GITHUB_TOKEN}}
          workflow: cargo-build.yml
          name: qpm-linux-x64
          path: QPM
          repo: QuestPackageManager/QPM.CLI

      - name: Put QPM on path
        run: |
          chmod +x ./QPM/qpm
          echo "${GITHUB_WORKSPACE}/QPM" >> $GITHUB_PATH

      - name: QPM Collapse
        run: |
          qpm collapse

      - name: QPM Dependencies Cache
        id: cache-qpm-deps
        uses: actions/cache@v4
        env:
          cache-name: cache-qpm-deps
        with:
          path: /home/runner/.local/share/QPM-RS/cache
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('qpm.json') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: QPM NDK Download
        run: |
          qpm ndk download 27.2.12479018

      - name: QPM NDK Resolve
        run: |
          qpm ndk resolve

      - name: QPM Restore
        run: |
          qpm restore

      - name: List Post Restore
        run: |
          echo includes:
          ls -la ${GITHUB_WORKSPACE}/extern/includes
          echo libs:
          ls -la ${GITHUB_WORKSPACE}/extern/libs
          echo cache:
          ls -la $HOME/.local/share/QPM-RS/cache

      - name: Verify source after QPM restore
        run: |
          echo "assets.hpp after QPM restore:"
          sed -n '19,28p' include/assets.hpp
          if grep -q 'array->values\|array->Length()' include/assets.hpp; then
            echo "::error::QPM restore changed assets.hpp back to the old Array API"
            git diff -- include/assets.hpp || true
            exit 1
          fi

      - name: Build
        run: |
          cd ${GITHUB_WORKSPACE}
          pwsh ./scripts/build.ps1 -clean
          echo "Built libraries:"
          ls -lah ./build

      - name: Create Qmod
        run: |
          cd ${GITHUB_WORKSPACE}
          qpm qmod manifest
          pwsh ./scripts/createqmod.ps1 AudioLink -clean
          test -f ./AudioLink.qmod
          ls -lh ./AudioLink.qmod

      - name: Upload qmod
        if: "${{ env.WEBHOOK != '' }}"
        uses: tsickert/discord-webhook@v3.2.0
        with:
          webhook-url: ${{ env.WEBHOOK }}
          content: "**Build:** #${{ github.run_number }} | **Build Succeeded:** 🟢 | **Download Qmod here:** ⬇️"
          username: "${{ github.repository }}"
          avatar-url: "http://github.com/${{ env.CI_ACTOR }}.png"
          filename: ./${{ env.qmodName }}.qmod
